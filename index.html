<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <div>
          <img
            src="https://static.vecteezy.com/system/resources/thumbnails/027/127/571/small_2x/pokemon-logo-pokemon-icon-transparent-free-png.png"
            alt=""
          />
        </div>
      </nav>

      <section class="banner">
        <div class="banner-text">
          <h1>POKEDEX</h1>
        </div>
        <div class="banner-des">
          <p>
            Explora los pokemones mas populares. Esta pokedex contiene
            informacion basica y acceso a cada detalle
          </p>
        </div>
      </section>

      <section class="cotenedor-pokemones">
        <article class="pokemon">
          <div class="pokemon-nombre">
            <h2>Bullbasaur</h2>
          </div>

          <div class="pokemon-imagen">
            <img
              class="pokemon-img"
              src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/001.png"
              alt=""
            />
          </div>

          <div class="pokemon-des">
            <h4>Peso: 50kg</h4>
            <h4>Tipo: Planta</h4>
          </div>
        </article>

        <article class="pokemon">
          <div class="pokemon-nombre">
            <h2>Charmander</h2>
          </div>

          <div class="pokemon-imagen">
            <img
              class="pokemon-img"
              src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/004.png"
              alt=""
            />
          </div>

          <div class="pokemon-des">
            <h4>Peso: 30kg</h4>
            <h4>Tipo: Fuego</h4>
          </div>
        </article>

        <article class="pokemon">
          <div class="pokemon-nombre">
            <h2>Pikachu</h2>
          </div>

          <div class="pokemon-imagen">
            <img
              class="pokemon-img"
              src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/025.png"
              alt=""
            />
          </div>

          <div class="pokemon-des">
            <h4>Peso: 30kg</h4>
            <h4>Tipo: Electrico</h4>
          </div>
        </article>

        <article class="pokemon">
          <div class="pokemon-nombre">
            <h2>Pidgeot</h2>
          </div>

          <div class="pokemon-imagen">
            <img
              class="pokemon-img"
              src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/018.png"
              alt=""
            />
          </div>

          <div class="pokemon-des">
            <h4>Peso: 5kg</h4>
            <h4>Tipo: Volador</h4>
          </div>
        </article>

        <article class="pokemon">
          <div class="pokemon-nombre">
            <h2>Squirtle</h2>
          </div>

          <div class="pokemon-imagen">
            <img
              class="pokemon-img"
              src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/007.png"
              alt=""
            />
          </div>

          <div class="pokemon-des">
            <h4>Peso: 20kg</h4>
            <h4>Tipo: Agua</h4>
          </div>
        </article>
      </section>
    </header>
  </body>
</html>
